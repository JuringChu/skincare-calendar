<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f5ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="保養日曆"><meta name="description" content="屬於你的每日保養儀式，輕鬆安排一週早晚保養。"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>我的保養日曆</title><script src="script.js" defer></script></head>
<body><main><header><div class="heading"><h1>我的保養日曆<span class="heading-dot">.</span></h1><button id="today" class="small-button">回到今天 ↗</button></div><p id="date" class="date"></p></header>
<section class="calendar" aria-label="每週保養日曆"><div class="section-label"><span>一週的溫柔節奏</span><span id="month"></span></div><nav id="week" aria-label="選擇星期"></nav><div class="period" role="group" aria-label="選擇早上或晚上"><button data-period="am">☀️ 早上保養</button><button data-period="pm">🌙 晚上保養</button></div></section>
<section id="routine" aria-live="polite"></section><div id="warning" class="warning" role="status" hidden></div>
<div class="steps-heading"><h2>今天的保養步驟</h2><span id="step-count"></span></div><section id="steps" aria-label="使用順序"></section>
<section class="plan-entry"><span class="plan-icon">▦</span><div><h2>讓保養，配合你的生活</h2><p>調整一週早晚安排，找到舒服的節奏。</p></div><button id="edit" class="small-button">編輯週計畫 ↗</button></section>
<footer>留一點時間給自己，也留一點溫柔給肌膚。<br><span id="storage-status">排程會自動保存在這個瀏覽器</span></footer></main>
<dialog id="editor"><div class="dialog-top"><div><p class="eyebrow">專屬於你的節奏</p><h2>編輯週計畫</h2></div><button id="close" class="close-button" aria-label="關閉編輯週計畫">✕</button></div><div class="period editor-period" role="group" aria-label="選擇要編輯的時段"><button data-edit-period="am">☀️ 早上</button><button data-edit-period="pm">🌙 晚上</button></div><p class="edit-help">拖動右側把手到另一天，即可交換安排。<br>也可以依序點選兩張卡片交換。</p><div id="edit-days"></div><p id="edit-status" role="status" class="edit-status">選擇第一天，或拖動把手。</p><div class="editor-footer"><button id="reset" class="text-button">恢復預設排程</button><button id="done" class="primary-button">完成</button></div></dialog><div id="toast" role="status"></div></body></html>
